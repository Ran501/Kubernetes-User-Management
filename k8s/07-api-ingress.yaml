apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: api-ingress
  namespace: usermgmt-02230122
spec:
  ingressClassName: cloud-provider-kind
  rules:
    - host: usermgmt-02230122.local
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: api
                port:
                  number: 80
